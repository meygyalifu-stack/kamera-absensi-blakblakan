
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera Absensi Warung Blakblakan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #333;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
    }
    video, canvas, img {
      width: 100%;
      border-radius: 10px;
      margin-top: 12px;
      background: #222;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #344b35;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background: #999;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Absensi Warung Blakblakan</h2>
    <p>Ambil foto selfie untuk bukti absensi.</p>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="preview" style="display:none" alt="Pratinjau selfie">

    <button id="captureButton" onclick="ambilFoto()">Ambil Foto</button>
    <button id="sendButton" onclick="kirimFoto()" disabled>
      Kirim Foto ke Absensi
    </button>

    <p id="status">Mengaktifkan kamera...</p>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const statusText = document.getElementById('status');
    const captureButton = document.getElementById('captureButton');
    const sendButton = document.getElementById('sendButton');

    let fotoData = null;
    let stream = null;

    async function aktifkanKamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        statusText.textContent = 'Kamera aktif. Silakan ambil foto selfie.';
      } catch (error) {
        statusText.textContent =
          'Kamera tidak dapat diaktifkan. Periksa izin kamera pada browser.';
      }
    }

    function ambilFoto() {
      if (!video.videoWidth) {
        statusText.textContent = 'Kamera belum siap. Coba beberapa saat lagi.';
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const context = canvas.getContext('2d');
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      fotoData = canvas.toDataURL('image/jpeg', 0.75);

      preview.src = fotoData;
      preview.style.display = 'block';
      video.style.display = 'none';

      captureButton.textContent = 'Ambil Ulang Foto';
      sendButton.disabled = false;
      statusText.textContent = 'Foto berhasil diambil. Periksa hasil foto sebelum mengirim.';
    }

    function kirimFoto() {
      if (!fotoData) {
        statusText.textContent = 'Silakan ambil foto terlebih dahulu.';
        return;
      }

      if (!window.opener || window.opener.closed) {
        statusText.textContent =
          'Halaman absensi tidak ditemukan. Buka kamera melalui tombol di halaman absensi.';
        return;
      }

      sendButton.disabled = true;
      statusText.textContent = 'Mengirim foto ke halaman absensi...';

      window.opener.postMessage({
        type: 'WARUNG_SELFIE',
        foto: fotoData
      }, '*');

      statusText.textContent =
        'Foto sudah dikirim ke halaman absensi. Silakan kembali ke tab absensi.';
    }

    captureButton.addEventListener('click', () => {
      if (fotoData) {
        fotoData = null;
        preview.style.display = 'none';
        video.style.display = 'block';
        captureButton.textContent = 'Ambil Foto';
        sendButton.disabled = true;
        statusText.textContent = 'Silakan ambil foto ulang.';
      }
    });

    aktifkanKamera();
  </script>
</body>
</html>
