<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera Absensi Warung Blakblakan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #333;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
    }
    video, canvas, img {
      width: 100%;
      border-radius: 10px;
      margin-top: 12px;
      background: #222;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #344b35;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Absensi Warung Blakblakan</h2>
    <p>Ambil foto selfie untuk bukti absensi.</p>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <img id="preview" style="display:none" alt="Pratinjau selfie">

    <button id="captureButton" disabled>Menyiapkan Kamera...</button>
    <button id="sendButton" disabled>Kirim Foto ke Absensi</button>

    <p id="status">Mengaktifkan kamera...</p>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const statusText = document.getElementById('status');
    const captureButton = document.getElementById('captureButton');
    const sendButton = document.getElementById('sendButton');

    let fotoData = null;
    let stream = null;

    async function aktifkanKamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        captureButton.disabled = false;
        captureButton.textContent = 'Ambil Foto';
        statusText.textContent = 'Kamera aktif. Silakan ambil foto selfie.';
      } catch (error) {
        statusText.textContent = 'Kamera gagal diaktifkan: ' + error.message;
      }
    }

    function ambilFoto() {
      try {
        if (!video.srcObject || video.videoWidth === 0) {
          throw new Error('Kamera belum siap.');
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        fotoData = canvas.toDataURL('image/jpeg', 0.75);

        preview.src = fotoData;
        preview.style.display = 'block';
        video.style.display = 'none';

        captureButton.textContent = 'Ambil Ulang Foto';
        sendButton.disabled = false;
        statusText.textContent = 'Foto berhasil diambil. Periksa hasilnya.';
      } catch (error) {
        statusText.textContent = 'Gagal mengambil foto: ' + error.message;
      }
    }

    function ulangiFoto() {
      fotoData = null;
      preview.removeAttribute('src');
      preview.style.display = 'none';
      video.style.display = 'block';
      sendButton.disabled = true;
      captureButton.textContent = 'Ambil Foto';
      statusText.textContent = 'Silakan ambil foto ulang.';
    }

    function kirimFoto() {
      if (!fotoData) {
        statusText.textContent = 'Ambil foto terlebih dahulu.';
        return;
      }

      if (!window.opener || window.opener.closed) {
        statusText.textContent = 'Halaman absensi tidak terhubung.';
        return;
      }

      sendButton.disabled = true;
      statusText.textContent = 'Mengirim foto ke halaman absensi...';

      window.opener.postMessage({
        type: 'WARUNG_SELFIE',
        foto: fotoData
      }, '*');

      statusText.textContent = 'Pesan foto sudah dikirim.';

      window.opener.focus();

      setTimeout(function() {
        window.close();
      }, 1500);
    }

    captureButton.addEventListener('click', function() {
      if (fotoData) {
        ulangiFoto();
      } else {
        ambilFoto();
      }
    });

    sendButton.addEventListener('click', kirimFoto);

    window.addEventListener('beforeunload', function() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });

    aktifkanKamera();
  </script>
</body>
</html>
